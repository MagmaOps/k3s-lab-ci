# .github/workflows/job-search-lab-publish.yaml
#
# Builds and pushes both job-search-lab images to Docker Hub. Mirrors build-push.sh
# in the app repo (same image names, <version> + latest tags).

name: job-search-lab publish

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      # Git tag such as v1.5.2; becomes the image tag.
      version:
        required: true
        type: string
      repository:
        required: false
        type: string
        default: MagmaOps/job-search-lab
      registry:
        required: false
        type: string
        default: magmakomer
      # NEXT_PUBLIC_API_URL is inlined by `next build`, so it is fixed per image.
      web_api_url:
        required: false
        type: string
        default: http://jobsearch.lab.local/api
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  publish:
    runs-on: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # Guard against releasing a tag whose kustomize base still points at an older version.
      - name: Check kustomization tag matches release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -q "newTag: ${VERSION}$" k8s/base/kustomization.yaml; then
            echo "::error::k8s/base/kustomization.yaml does not pin ${VERSION}"
            exit 1
          fi

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ inputs.registry }}/jobsearch-backend:${{ inputs.version }}
            ${{ inputs.registry }}/jobsearch-backend:latest

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.web_api_url }}
          tags: |
            ${{ inputs.registry }}/jobsearch-web:${{ inputs.version }}
            ${{ inputs.registry }}/jobsearch-web:latest
