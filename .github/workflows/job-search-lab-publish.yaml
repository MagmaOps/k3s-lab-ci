# .github/workflows/job-search-lab-publish.yaml
#
# Builds and pushes both job-search-lab images to Docker Hub. Mirrors build-push.sh
# in the app repo (same image names, <version> + latest tags).

name: job-search-lab publish

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repository:
        required: false
        type: string
        default: MagmaOps/job-search-lab
      registry:
        required: false
        type: string
        default: magmakomer
      # NEXT_PUBLIC_API_URL is inlined by `next build`, so it is fixed per image.
      web_api_url:
        required: false
        type: string
        default: http://jobsearch.lab.local/api
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

# pull-requests: write is needed to leave the version comment; the caller must grant it too.
permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    runs-on: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      # The image tag is the version pinned in the kustomize base (bumped per release),
      # so no git tag is needed; both images must pin the same version.
      - name: Read version from kustomization
        id: ver
        run: |
          set -euo pipefail
          tags=$(grep -E '^\s+newTag:' k8s/base/kustomization.yaml | awk '{print $2}' | sort -u)
          if [ "$(echo "$tags" | wc -l)" -ne 1 ]; then
            echo "::error::backend and web newTag differ in k8s/base/kustomization.yaml: $tags"
            exit 1
          fi
          echo "version=$tags" >> "$GITHUB_OUTPUT"

      # Show the version up front: log annotation, run summary and a comment on the PR
      # that produced the commit (if any; a failure to comment never fails the build).
      - name: Announce target version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ inputs.registry }}
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ inputs.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          msg="Building \`$REGISTRY/jobsearch-backend:$VERSION\` and \`$REGISTRY/jobsearch-web:$VERSION\` ([run]($RUN_URL))"
          echo "::notice title=Target image version::$VERSION"
          echo "### Target version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          # PR number from the caller's event; fall back to a commit->PR lookup.
          pr="$EVENT_PR"
          if [ -z "$pr" ]; then
            sha=$(git rev-parse HEAD)
            pr=$(gh api "repos/$REPO/commits/$sha/pulls" --jq '.[0].number // empty')
          fi
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$REPO" --body "$msg"
          else
            echo "No PR associated with $sha, skipping comment."
          fi

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Versioned tags are immutable: refuse to overwrite an existing version of either
      # image. (`latest` is intentionally moved on every publish.)
      - name: Refuse to overwrite an existing tag
        env:
          REGISTRY: ${{ inputs.registry }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          failed=0
          for ref in "$REGISTRY/jobsearch-backend:$VERSION" "$REGISTRY/jobsearch-web:$VERSION"; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref already exists on Docker Hub."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Bump newTag in k8s/base/kustomization.yaml (and the overlay) to a new version."
            exit 1
          fi

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ inputs.registry }}/jobsearch-backend:${{ steps.ver.outputs.version }}
            ${{ inputs.registry }}/jobsearch-backend:latest

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.web_api_url }}
          tags: |
            ${{ inputs.registry }}/jobsearch-web:${{ steps.ver.outputs.version }}
            ${{ inputs.registry }}/jobsearch-web:latest
