# .github/workflows/ai-dev-platform-validate.yaml
#
# Reusable validation for MagmaOps/ai-dev-platform. Nothing here pushes or deploys.

name: ai-dev-platform validate

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      repository:
        required: false
        type: string
        default: MagmaOps/ai-dev-platform

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Shell scripts: LF line endings (they run on Linux) + ShellCheck
  # ---------------------------------------------------------------------------
  aidev_scripts:
    runs-on: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Check LF line endings
        run: |
          set -euo pipefail
          bad=$(git ls-files '*.sh' 'tools/windows/agent' | while read -r f; do
            if [ "$(tr -cd '\r' < "$f" | wc -c)" -gt 0 ]; then echo "$f"; fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings in: $bad"
            exit 1
          fi

      # Pinned release binary, verified against a checksum recorded here (same
      # approach as herdr in the Dockerfile). Update version and hash together.
      # .tar.gz, not .tar.xz: the runner image has no xz.
      - name: Install ShellCheck
        env:
          SC_VERSION: v0.11.0
          SC_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sc.tar.gz \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.gz"
          echo "${SC_SHA256}  /tmp/sc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sc.tar.gz -C /tmp
          echo "/tmp/shellcheck-${SC_VERSION}" >> "$GITHUB_PATH"

      - name: ShellCheck
        run: shellcheck scripts/*.sh tools/windows/agent

  # ---------------------------------------------------------------------------
  # Dockerfile: Hadolint (fails on errors only; warnings are shown in the log)
  # ---------------------------------------------------------------------------
  aidev_dockerfile:
    runs-on: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Install Hadolint
        env:
          HL_VERSION: v2.15.1
          HL_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HL_VERSION}/hadolint-linux-x86_64"
          echo "${HL_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint

      - name: Hadolint
        run: /tmp/hadolint --failure-threshold error docker/Dockerfile

  # ---------------------------------------------------------------------------
  # Kubernetes manifests: render with Kustomize, validate with kubeconform, and
  # make sure every place that pins the image version agrees.
  # ---------------------------------------------------------------------------
  aidev_manifests:
    runs-on: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.4'

      - name: Setup Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      # Build to a temp file and move on success, so a failed render never leaves a
      # partial file that kubeconform would happily "pass".
      - name: Render manifests
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          for target in base homelab; do
            case "$target" in
              base)    src=k8s/base ;;
              homelab) src=k8s/overlays/homelab ;;
            esac
            kubectl kustomize "$src" > "/tmp/rendered/${target}.yaml.tmp"
            mv "/tmp/rendered/${target}.yaml.tmp" "/tmp/rendered/${target}.yaml"
          done

      - name: Validate manifests
        run: |
          kubeconform \
            -summary \
            -strict \
            -kubernetes-version 1.35.4 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered/*.yaml

      # The pinned tag must be a plain semver and identical everywhere it appears.
      - name: Check image version pins
        run: |
          set -euo pipefail
          tags=$(grep -hE '^\s+newTag:' k8s/base/kustomization.yaml k8s/overlays/homelab/kustomization.yaml \
                 | awk '{print $2}' | sort -u)
          if [ "$(echo "$tags" | wc -l)" -ne 1 ]; then
            echo "::error::newTag differs between base and homelab overlay: $tags"
            exit 1
          fi
          if ! echo "$tags" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::newTag must be semver (never latest): $tags"
            exit 1
          fi
          echo "image version: $tags"

  # ---------------------------------------------------------------------------
  # Docker: prove the image builds (no push; publishing is a separate workflow)
  # ---------------------------------------------------------------------------
  aidev_image:
    runs-on: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
