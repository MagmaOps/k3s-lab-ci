# .github/workflows/k3s-validate.yaml

name: k3s validate

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  validate:
    runs-on: arc-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: MagmaOps/k3s-lab
          ref: ${{ inputs.ref }}

      - name : Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.35.4'
        id: install

      - name: Setup Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Validate setup
        run: |
          kubectl version --client
          kubeconform -v
          kubeconform -h | grep -A5 schema-location
          git log -1 --pretty=format:"%H %s"

      - name: kustomize build
        run: |
          kubectl kustomize platform/environments/prod > /tmp/platform.yaml
          kubectl kustomize apps/environments/prod > /tmp/apps.yaml
      
      - name: validate manifests
        run: |
          kubeconform \
            -summary \
            -strict \
            -kubernetes-version 1.35.4 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            bootstrap/environments/prod/*.yaml
